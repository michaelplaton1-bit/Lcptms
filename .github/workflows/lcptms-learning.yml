name: LCPTMS Continuous Learning

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose LCPTMS learning authentication
        run: |
          echo "Calling safe auth diagnostic..."
          curl --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.LCPTMS_LEARNING_SECRET }}" \
            https://lcptms.vercel.app/api/learning-auth-diagnostic

      - name: Capture LCPTMS learning snapshot
        shell: bash
        run: |
          set +e
          HTTP_CODE=$(curl --silent --show-error \
            -o /tmp/lcptms_capture.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.LCPTMS_LEARNING_SECRET }}" \
            https://lcptms.vercel.app/api/learning-capture)

          echo
          echo "LCPTMS capture HTTP status: ${HTTP_CODE}"
          echo "LCPTMS capture response:"
          cat /tmp/lcptms_capture.json
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Learning capture failed."
            exit 1
          fi
